<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black-Jack</title>
    <link rel="stylesheet" href="blackjack.css" />
    <script src="blackjack.js" defer></script>
  </head>

  <body>
    <div id="board">
      <div class="side">
        <h3>Player: <span id="playerSum"></span></h3>
        <div id="PlayerCards"></div>
      </div>

      <div class="divider"></div>

      <div class="side">
        <h3>Dealer: <span id="dealerSum"></span></h3>
        <div id="DealerCards">
          <img id="hiddenCard" src="./cards/Back.png" />
        </div>
      </div>


    </div>
      <p id="results"></p>
    <div class>
      <button id="newGame">Deal</button>
      <button id="moreCard">Hit</button>
      <button id="stop">Stand</button>
    </div>
  </body>
</html>
