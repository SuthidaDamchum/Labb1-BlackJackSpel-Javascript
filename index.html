<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black Jack Game</title>
    <link rel="stylesheet" href="blackjack.css" />
    <script src="blackjack.js" defer></script>
  </head>

  <body>


    <div class="header">
        <h1 class="game-title">BLACKJACK CASINO</h1>

     
    </div>

    <div id="board">

      <p id="results"></p>

      <div class="side">

        <h3>Player: <span id="playerSum"></span></h3>
        <div id="PlayerCards"></div>
      </div>

      <div class="divider"></div>

      <div class="side">
        <h3>Dealer: <span id="dealerSum"></span></h3>
        <div id="DealerCards">
        <img id="hiddenCard" src="./cards/Back.png" />
        </div>
      </div>
    </div>
        <div class="money-container">
            <span class="label">Balance:</span>
            <span class="value">$<span id="balance">1000</span></span>
        </div>

    <div class>
      <button id="newGame">Deal</button>
      <button id="moreCard">Hit</button>
      <button id="stop">Stand</button>
    </div>

   



  </body>
</html>
