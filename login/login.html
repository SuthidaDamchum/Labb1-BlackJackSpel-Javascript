<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackjack Casino Login</title>
    <link rel="stylesheet" href="login.css" />
    <script src="blackjack.js" defer></script>
    <script src="login.js" defer></script>
  </head>
  <body>
    <header>
      <h1 class="game-title">BLACKJACK CASINO</h1>
      <button class="btnLogin-popup">Login</button>
    </header>

    
    <div class="wrapper">
      <span class="icon-close">
        <ion-icon name="close-outline"></ion-icon>
      </span>

      <div class="form-box login">
        <h2>Login</h2>

        <form id="login-form">
          <div class="input-box">
            <span class="icon"
              ><ion-icon name="person-outline"></ion-icon
            ></span>
            <input type="text" id="login-username" required />
            <label>Username</label>
          </div>

          <div class="input-box">
            <span class="icon"
              ><ion-icon name="lock-closed-outline"></ion-icon
            ></span>
            <input type="password" id="login-password" required />
            <label>Password</label>
          </div>

          <button type="submit" id="login-submit" class="btn">Login</button>

          <div class="login-register">
            <p>
              Don't have an account?
              <a href="#" class="register-link">Register</a>
            </p>
          </div>
        </form>
      </div>

      <div class="form-box register">
        <h2>Registration</h2>

        <form id="register-form">
          <div class="input-box">
            <span class="icon"
              ><ion-icon name="person-outline"></ion-icon
            ></span>
            <input type="text" id="register-username" required />
            <label>Username</label>
          </div>

          <div class="input-box">
            <span class="icon"
              ><ion-icon name="lock-closed-outline"></ion-icon
            ></span>
            <input type="password" id="register-password" required />
            <label>Password</label>
          </div>

          <button type="submit" id="register-submit" class="btn">
            Register
          </button>
          <div class="login-register">
            <p>
              Already have an account? <a href="#" class="login-link">Login</a>
            </p>
          </div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
