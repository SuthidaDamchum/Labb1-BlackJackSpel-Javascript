<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black Jack Game</title>
    <link rel="stylesheet" href="blackjack.css" />
    <script src="blackjack.js" defer></script>
  </head>

  <body>


    <div class="header">
      <h1 class="game-title">BLACKJACK CASINO</h1>
    </div>

    <div id="board">
      <p id="results"></p>

      <div class="side">
        <h3>Player: <span id="playerSum"></span></h3>
        <div id="PlayerCards"></div>
      </div>

      <div class="divider"></div>

      <div class="side">
        <h3>Dealer: <span id="dealerSum"></span></h3>

        <div id="DealerCards">
          <img id="hiddenCard" src="./cards/Back.png" />
        </div>
      </div>
    </div>

    

<div class="status-box">
    <h3>Bet: <span id="bet-display">0</span> $</h3>
</div>

    <div class="money-container">
      <span class="label">Balance:</span>
      <span class="value">$<span id="balance">1000</span></span>
    </div>

    <div class="coins">
      <img id="chip100" src="./coins/100.PNG" onClick="placeBet(100)" />
      <img id="chip200" src="./coins/200.PNG" onClick="placeBet(200)" />
      <img id="chip500" src="./coins/500.PNG" onClick="placeBet(500)" />
      <img id="chip500" src="./coins/1000.PNG" onClick="placeBet(1000)" />
    </div>
 
      <button id="start-button">SIT DOWN</button>
    </div>

    <div class>
      <button id="newGame">Deal</button>
      <button id="moreCard">Hit</button>
      <button id="stop">Stand</button>
    </div>
  </body>
</html>
