<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black Jack Game</title>
    <link rel="stylesheet" href="blackjack.css" />
    <script src="blackjack.js" defer></script>
  </head>

  <body>
    <div class="header">
      <h1 class="game-title">BLACKJACK CASINO</h1>
    </div>

    <div id="board">
      <p id="results"></p>

      <div class="side">
        <h3>Player: <span id="playerSum"></span></h3>
        <div id="PlayerCards"></div>
      </div>

      <div class="divider"></div>

      <div class="side">
        <h3>Dealer: <span id="dealerSum"></span></h3>

        <div id="DealerCards">
        </div>
      </div>
    </div>

    <div class="status-row">
      <div class="money-container">
        <span class="label">Balance:</span>
        <span class="value">$<span id="balance">1000</span></span>
      </div>

      <div class="bet-container">
        <h3>Bet: <span id="bet-display">0</span> $</h3>
      </div>
    </div>

    <div class="coins">
      <img
        id="chip100"
        src="../coins/100.PNG"
        class="coins"
        onClick="placeBet(100)"
      />
      <img
        id="chip200"
        src="../coins/200.PNG"
        class="coins"
        onClick="placeBet(200)"
      />
      <img
        id="chip500"
        src="../coins/500.PNG"
        class="coins"
        onClick="placeBet(500)"
      />
      <img
        id="chip1000"
        src="../coins/1000.PNG"
        class="coins"
        onClick="placeBet(1000)"
      />
    </div>

    <div class="controls">
      <button id="topup-money">Top up $1000</button>
      <button id="start-button">Sit Down</button>
      <button id="newGame">Deal</button>
      <button id="moreCard">Hit</button>
      <button id="stop">Stand</button>
    </div>

    <div class="exit">
      <button id="exit">Exit</button>
    </div>

    <div id="exitModal" class="modal">
      <div class="modal-content">
        <h3>Do you want to exit?</h3>
        <p>You will lose the money you have bet!</p>
        <div class="modal-buttons">
          <button id="confirmExit">Yes, Leave</button>
          <button id="cancleExit">Stay</button>
        </div>
      </div>
    </div>

    <div class="player-info">
      <h2 id="display-name"></h2>
    </div>
  </body>
</html>
